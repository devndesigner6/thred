# Thred deployment: Render hosts PostgreSQL and the Express API; Vercel hosts apps/frontend.
# Set sync:false values in the Render dashboard before deploying.

databases:
  - name: thred-db
    plan: free
    databaseName: thred
    user: thred

services:
  - type: web
    name: thred-api
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci
    preDeployCommand: npm run db:deploy --workspace=@repo/db
    startCommand: npx tsx apps/api/src/index.ts
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: thred-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CREDENTIAL_ENCRYPTION_SECRET
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: HYDRA_DB_API_KEY
        sync: false
      - key: MODEL_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
